# Definition file for a hybrid undulator (containing magnets and poles) with period length 24
#
# =============================================================================
# GENERAL PARAMETERS
# =============================================================================
general:
  origin: [0.0, 0.0, 0.0]              # Origin of the device in [X, Y, Z] coordinates
  coordinate_names: ['X', 'Y', 'Z']    # Coordinate system labels, X-horizontal, Y-vertical, Z-longitudinal
  symmetries: ['X','Y']                # Normal directions to symmetrie planes - geometry definitions are such that full undulator is only created after application of these symmetry operations

# =============================================================================
# UNDULATOR PARAMETERS
# =============================================================================
undulator:
  name: "CPMU24"
  type: "Planar-Hybrid"                  # Undulator type: "Plain_APPLE" or "Compensated_APPLE"
  accelerator: "BESSYII"               # Name of the accelerator
  periods: 73                          # Number of periods in the undulator
  minimum_gap: 5.5                     # Minimum designed gap in mm
  shim_mp: 0.0                            # Gap between magnets in a row in mm
  shim_pm: 0.5                            # Gap between magnets in a row in mm
  period_length: 24.0                  # Primary period length in mm
  magnetization_first_magnet: [0.0,0.0,-1.0] # the magnetization vector of first periodic magnet on lower beam

# =============================================================================
# Geometry Definitions
# =============================================================================
geometry_info_file: "hyu24_geometries.yaml"
material_file_folder: ""

periodic_pole:
  geometry: "periodic_pole"
  y_drop: 0.0 # drop in y-direction (positive=farther away from beam)
  y_alignment_0: "gap" # describing how the vertical direction is aligned: "gap" - top of element is aligned via gap value (without y_drop)
  material_id: 'fm_vanadium_permendur'

periodic_magnet:
  geometry: "periodic_magnet"
  material_id: 'pm_rec'
  y_drop: -0.07 # drop in y-direction (positive=farther away from beam)
  y_alignment_0: "gap" # describing how the vertical direction is aligned: "gap" - top of element is aligned via gap value (y_drop is applied later)
  remanence: 1.58                   # Block remanence in T (1.21 * 1.344 for cryogenic grade)

end_pole:
  geometry: "end_pole"
  y_drop: 0.0 # drop in y-direction (positive=farther away from beam)
  y_alignment_0: "bottom_periodic_magnet" # describing how the vertical direction is aligned: "gap" - top of element is aligned via gap value (without y_drop)  
  material_id: 'fm_vanadium_permendur'

end_magnet_1:
  geometry: "end_magnet_1"
  material_id: 'pm_rec'
  y_drop: 0.0 # drop in y-direction (positive=farther away from beam)
  y_alignment_0: "bottom_periodic_magnet" # describing how the vertical direction is aligned: "gap" - top of element is aligned via gap value (y_drop is applied later), "bottom_xxx" - bottom aligned with bottom of the object   
  remanence: 1.58                   # Block remanence in T (1.21 * 1.344 for cryogenic grade)

end_magnet_2:
  geometry: "end_magnet_2"
  material_id: 'pm_rec'
  y_drop: 0.0 # drop in y-direction (positive=farther away from beam)
  y_alignment_0: "bottom_periodic_magnet" # describing how the vertical direction is aligned: "gap" - top of element is aligned via gap value (without y_drop), "bottom" - bottom aligned with lowest edge
  remanence: 1.58                   # Block remanence in T (1.21 * 1.344 for cryogenic grade)

end_struct: 
  type: 'standard' # standard for a hybrid undulator: sets the sequence_up/down defined below
#  sequence_up: ['end_magnet_2','shim_mp','end_pole','shim_pm','end_magnet_1','shim_mp'] # sequence (up- to downstream) defining the end structure, can contain element names or numbers - interpreted as x-distances
#  sequence_down: ['shim_mp','periodic_pole','shim_pm','end_magnet_1','shim_mp','end_pole','shim_pm','end_magnet_2'] # sequence (up- to downstream) defining the end structure, can contain element names or numbers - interpreted as x-distances

  # Standard End Configuration for permanent magnet undulators:
  #		1 Periodischer Magnet = 4 Striche |----|
  #		Endpart	       |   Periodic Part
  # Row:        |-|  |––|  |---|----|-----| ....
  #          ->2.5*Perioden länge = Endstruktur|  

# =============================================================================
# NOTES AND DOCUMENTATION
# =============================================================================
metadata:
  author: ""
  created: "2024-01-01"
  version: "1.0"
  description: |
  notes: |
    - All length units are in millimeters (mm) unless otherwise specified
    - Magnetic field units are in Tesla (T)

