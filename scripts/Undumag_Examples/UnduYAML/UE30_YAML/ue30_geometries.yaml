# =============================================================================
# MAGNET/POLE SHAPE DEFINITIONS
# =============================================================================
# Two-sided Clamps - a
#     ____
#  __|  __|
# |____|

#
# Two-sided Clamps - b
#     ____
#  __|    |__
# |__________|
#

periodic_magnet:
  form_type: 'twoSidedClamps_a'  # types: 'square', 'oneSidedClamps', 'cpmuStdPole', 'twoSidedClamps_a/b'
  main_block_dimensions: [28.5, 28.5, 7.32]  # [width, height, thickness] in mm (thickness calculated automatically)  
  clamp_cutout: [5.0,11.3,7.32] # dimensions of clamps to be cut-out of full blocks, upper left corners if object viewed in x-y plane, cut-out in lower right corner is rotated by 90 degrees! (x and y interchange place) 
  chamf: 0.0 #3 # chamfer in up- and down-stream direction
  fracs: [1,1]
  segms: [4,2,4]

compensation_magnet:
  form_type: 'twoSidedClamps_b'   # types: 'square', 'oneSidedClamps', 'cpmuStdPole', 'twoSidedClamps_a/b'
  main_block_dimensions: [35.0, 20.0, 7.32]  # [width, height, thickness] in mm (thickness calculated automatically)  
  clamp_cutout: [5.0,11.3,7.32] # dimensions of clamps to be cut-out of full blocks, upper left corners if object viewed in x-y plane, symmetric cut-out in upper right corner
  chamf: 0.0 #3 # chamfer in up- and down-stream direction
  fracs: [1,1]
  segms: [4,2,4]
  

