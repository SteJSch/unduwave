# Definition file for an elliptical undulator with period length 30
#
# =============================================================================
# GENERAL PARAMETERS
# =============================================================================
general:
  origin: [0.0, 0.0, 0.0]              # Origin of the device in [X, Y, Z] coordinates
  coordinate_names: ['X', 'Y', 'Z']    # Coordinate system labels, X-horizontal, Y-vertical, Z-longitudinal
  symmetries: []                # Normal directions to symmetrie planes - geometry definitions are such that full undulator is only created after application of these symmetry operations

# =============================================================================
# UNDULATOR PARAMETERS
# =============================================================================
undulator:
  name: "UE30"
  type: "APPLE"                  # Undulator type: "Plain_APPLE" or "Compensated_APPLE"
  compensation: False  # shall compensation magnets (cm) be added?
  accelerator: "BESSYII"               # Name of the accelerator
  periods: 73                          # Number of periods in the undulator
  minimum_gap: 5.5                     # Minimum designed gap in mm
  shim_m: 0.102                            # Gap between magnets in a row in mm
  period_length: 30.0                  # Primary period length in mm
  magnetization_first_magnet: [0.0,0.0,-1.0] # the magnetization vector of first periodic magnet on lower beam
  row_slit: 0.792 
  keeper_slit: 0.258   # keeper slit for functional magnets, for cm's the slit is determined by the cm- and fm-keepers having the same z-length and their respective geometries
  dist_fm_cm: 16
  drop_cm: 0.05

# =============================================================================
# Geometry Definitions
# =============================================================================
geometry_info_file: "ue30_geometries.yaml"
material_file_folder: ""

periodic_magnet:
  geometry: "periodic_magnet"
  material_id: 'pm_rec'
  remanence: [1.25,1.28]                   # Block remanence in T (1.21 * 1.344 for cryogenic grade)

end_struct: 
  type: 'standard' # standard: periodic magnets as end magnets with lengths: 0.25, 0.5 and 0.75  , sequence: user defined sequence, 'none' : off
  sequence: [] # sequence (up- to downstream) defining the end structure, can contain element names or numbers - interpreted as x-di
  # Standard End Configuration for permanent magnet undulator:
  #		1 Periodischer Magnet = 4 Striche |----|
  #		Endpart	       |   Periodic Part
  # Row:        |-|  |––|  |---|----|-----| ....
  #          ->2.5*Perioden länge = Endstruktur|  
 
#three_keeper:
#  sequence: ['periodic_magnet',0.0,'periodic_magnet',shim_m,'periodic_magnet']  
 
rows:
  ll:
    sequence: ['upstream_end','periodic','three_keeper','downstream_end']
  lr:
    sequence: ['upstream_end','three_keeper','periodic','downstream_end']
  ul:
    sequence: ['upstream_end','three_keeper','periodic','downstream_end']
  ur: 
    sequence: ['upstream_end','periodic','three_keeper','downstream_end']

# =============================================================================
# NOTES AND DOCUMENTATION
# =============================================================================
metadata:
  author: ""
  created: "2024-01-01"
  version: "1.0"
  description: 
  notes: |
    - All length units are in millimeters (mm) unless otherwise specified
    - Magnetic field units are in Tesla (T)
